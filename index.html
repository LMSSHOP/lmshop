<html lang="pt-BR">

  <style>
    :root {
      --ink: #513344;
      --muted: #795d6c;
      --accent: #c83370;
      --line: #eec6d7;
      --bg-card: #ffffff;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { 
      margin: 0; 
      width: 100%; 
      min-height: 100vh;
      color: var(--ink); 
      font-family: 'DM Sans', sans-serif; 
      background-color: #fff7fa; 
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: center;
    }
    .display { font-family: 'Fraunces', serif; }
    .eyebrow { letter-spacing: .22em; text-transform: uppercase; font-size: 11px; font-weight: 700; color: var(--accent); }
    
    .portrait-wrap { position: relative; width: 100%; max-width: 320px; margin: 0 auto; }
    .portrait-wrap img {
      width: 100%;
      height: auto;
      border-radius: 20px;
      object-fit: cover;
      box-shadow: 0 4px 15px rgba(200, 51, 112, 0.15);
      border: 2px solid var(--line);
    }

    .bow { width: 48px; height: 36px; color: var(--accent); margin: 0 auto 16px auto; display: block; }

    .link-tree-container {
      max-width: 480px;
      margin: 0 auto;
      padding: 0 16px;
      width: 100%;
    }
    .link-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 16px 24px;
      margin-bottom: 14px;
      background-color: var(--bg-card);
      border: 2px solid var(--line);
      border-radius: 9999px;
      color: var(--ink);
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(200, 51, 112, 0.05);
      transition: all 0.25s ease;
    }
    .link-card:hover {
      background-color: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(200, 51, 112, 0.25);
    }
