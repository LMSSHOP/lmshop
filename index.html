<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L&amp;M Shop — Links &amp; Murder Mystery 2</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Fraunces:opsz,wght@9..144,400;500;600&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <style>
    :root {
      --ink: #513344;
      --muted: #795d6c;
      --accent: #c83370;
      --line: #eec6d7;
      --bg-card: #ffffff;
    }
    html { scroll-behavior: smooth; }
    body { 
      margin: 0; 
      width: 100%; 
      color: var(--ink); 
      font-family: 'DM Sans', sans-serif; 
      background-color: #fff7fa; 
    }
    .display { font-family: 'Fraunces', serif; }
    .fine-rule { border-color: var(--line); }
    .eyebrow { letter-spacing: .22em; text-transform: uppercase; font-size: 11px; font-weight: 700; }
    
    .portrait-wrap { position: relative; width: 100%; max-width: 320px; margin: 0 auto; }
    .portrait-wrap img {
      width: 100%;
      height: auto;
      border-radius: 20px;
      object-fit: cover;
      box-shadow: 0 4px 15px rgba(200, 51, 112, 0.15);
      border: 2px solid var(--line);
    }

    .bow { width: 48px; height: 36px; color: var(--accent); margin: 0 auto; }

    .link-tree-container {
      max-width: 480px;
      margin: 0 auto;
      padding: 0 16px;
    }
    .link-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 16px 24px;
      margin-bottom: 14px;
      background-color: var(--bg-card);
      border: 2px solid var(--line);
      border-radius: 9999px;
      color: var(--ink);
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(200, 51, 112, 0.05);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .link-card:hover {
      background-color: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(200, 51, 112, 0.25);
    }
    .link-card .badge {
      font-size: 11px;
      background: #ffe8f0;
      color: var(--accent);
      padding: 2px 10px;
      border-radius: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .link-card:hover .badge {
      background: #ffffff;
      color: var(--accent);
    }

    /* Pop-ups / Modais */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(81, 51, 68, 0.6);
      backdrop-filter: blur(4px);
      z-index: 50;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal:target {
      display: flex;
    }
    .modal-content {
      background: #ffffff;
      border: 2px solid var(--line);
      border-radius: 24px;
      width: 100%;
      max-width: 520px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 24px;
      position: relative;
      box-shadow: 0 10px 30px rgba(200, 51, 112, 0.2);
    }
    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: #ffe8f0;
      color: var(--accent);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: background 0.2s;
    }
    .modal-close:hover {
      background: var(--accent);
      color: #ffffff;
    }

    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; border-radius: 9999px; }
  </style>
</head>
